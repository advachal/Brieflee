name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=BRIEFLEE_KNOWLEDGE_URL=${{ vars.BRIEFLEE_KNOWLEDGE_URL || 'https://brieflee-knowledge-to1s.onrender.com' }}
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
