name: Check knowledge service

# Calls the hosted knowledge service: health, a document analysis of the
# sample judgment, and CORS for the website. Run it from the Actions tab
# after a server deploy.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Service URL (blank: the site's configured service)"
        default: ""
  push:
    branches: [main]
    paths: [.github/workflows/check-service.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url || vars.BRIEFLEE_KNOWLEDGE_URL || 'https://brieflee-knowledge-to1s.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Health (waits for a sleeping free instance)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -m 60 "$URL/v1/health" -o health.json; then break; fi
            sleep 10
          done
          python3 -c "import json;d=json.load(open('health.json'));print({k:d.get(k) for k in ('ok','records','generation','document_analysis')})"
      - name: Ask a question
        run: |
          curl -sS -m 240 -H 'content-type: application/json' \
            --data '{"question":"set aside arbitral award under section 34"}' "$URL/v1/ask" \
            -o ask.json -w "HTTP %{http_code} in %{time_total}s\n"
          python3 -c "import json;j=json.load(open('ask.json'));print(j['similar_decisions'],[c['name'] for c in j['counsel'][:5]])" || head -c 500 ask.json
      - name: Extract case facts from the sample judgment
        run: |
          python3 -c "import json;print(json.dumps({'text':open('test/fixtures/sample_judgment.txt').read()}))" > body.json
          curl -sS -m 240 -H 'content-type: application/json' --data @body.json "$URL/v1/extract" -o facts.json -w "HTTP %{http_code} in %{time_total}s\n"
          python3 -c "import json;f=json.load(open('facts.json'));print('facts:',{k:f.get(k) for k in ('court','case_number','deciding_judges','procedural_stage','client_side','case_category','provider')});print('counsel:',len(f.get('counsel',[])),'issues:',f.get('issues'));print(str(f.get('detail'))[:600])"
      - name: Analyze the sample judgment
        run: |
          python3 -c "import json;print(json.dumps({'text':open('test/fixtures/sample_judgment.txt').read()}))" > body.json
          curl -sS -m 240 -H 'content-type: application/json' --data @body.json "$URL/v1/analyze" -o out.json -w "HTTP %{http_code} in %{time_total}s\n"
          python3 .github/scripts/print_analysis.py out.json
      - name: CORS allows the website
        run: |
          curl -sS -m 30 -o /dev/null -D - -X OPTIONS "$URL/v1/analyze" \
            -H 'Origin: https://advachal.github.io' -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' | grep -i access-control
