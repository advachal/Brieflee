# Render blueprint for the optional knowledge service. Set KNOWLEDGE_DB_URL,
# and ANTHROPIC_API_KEY if you want grounded AI summaries, in the dashboard.
services:
  - type: web
    name: brieflee-knowledge
    runtime: docker
    dockerfilePath: server/Dockerfile
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
