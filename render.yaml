# Render blueprint for the knowledge service. In the Render dashboard set
# GROQ_API_KEY (and optionally GEMINI_API_KEY as a fallback) for the AI reading of
# questions and documents and the AI check of results.
services:
  - type: web
    name: brieflee-knowledge
    runtime: docker
    dockerfilePath: server/Dockerfile
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
