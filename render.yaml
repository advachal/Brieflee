# Render blueprint for the knowledge service. In the Render dashboard set
# GEMINI_API_KEY (or ANTHROPIC_API_KEY) for AI document analysis and answers.
services:
  - type: web
    name: brieflee-knowledge
    runtime: docker
    dockerfilePath: server/Dockerfile
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
