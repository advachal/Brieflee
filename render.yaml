# Render blueprint for the optional knowledge service. Set ANTHROPIC_API_KEY
# in the dashboard if you want grounded AI summaries.
services:
  - type: web
    name: brieflee-knowledge
    runtime: docker
    dockerfilePath: server/Dockerfile
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
